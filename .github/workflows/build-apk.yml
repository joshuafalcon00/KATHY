name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir www
          cp index.html manifest.json sw.js *.png www/

      - name: Install Capacitor
        run: npm install

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply clover icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_round.png
            rm -f $RES/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kathy-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
